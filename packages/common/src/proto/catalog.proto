syntax = "proto3";

package catalog;

service CatalogService{
    rpc GetShowtime (GetShowtimeRequest) returns (ShowtimeResponse);
    rpc GetTheaterSeats (GetTheaterSeatsRequest) returns (TheaterSeatsResponse);
}

message GetShowtimeRequest {
    int32 showtimeId = 1;
}

message ShowtimeResponse {
    int32 id = 1;
    int32 movieId = 2;
    int32 theaterId = 3;
    string start_time = 4;
    string end_time = 5;
    string price = 6;
}

message GetTheaterSeatsRequest {
    int32 theaterId = 1;
}

enum SeatType {
    STANDARD = 0;
    PREMIUM = 1;
    VIP = 2;
}

message Seat {
    int32 id = 1;
    int32 theaterId = 2;
    string seat_number = 3;
    SeatType type = 4;
}

message TheaterSeatsResponse {
    repeated Seat seats = 1;
}